{% extends 'base.html' %}
{% block content %}
<div class="row">
  <div class="col-md-6">
    <h3 class="mb-3">Trips</h3>
    <ul class="list-group mb-4">
      {% for trip in trips %}
      <li class="list-group-item d-flex justify-content-between align-items-center">
        <div>
          <a href="{{ url_for('main.view_trip', trip_id=trip.id) }}" class="fw-semibold">{{ trip.name }}</a>
          <span class="badge text-bg-secondary ms-2">{{ trip.currency }}</span>
        </div>
        <small class="text-muted">{{ trip.created_at.strftime('%Y-%m-%d') }}</small>
      </li>
      {% else %}
      <li class="list-group-item">No trips yet.</li>
      {% endfor %}
    </ul>
  </div>
  <div class="col-md-6">
    <h3 class="mb-3">Create Trip</h3>
    <form method="post" action="{{ url_for('main.create_trip') }}" class="card card-body">
      <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text" class="form-control" name="name" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Currency</label>
        <input type="text" class="form-control" name="currency" value="USD">
      </div>
      <button class="btn btn-primary">Create</button>
    </form>
  </div>
</div>
{% endblock %}
